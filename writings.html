<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-home">My Forest</a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="writings.html">Writings</a></li>
      <li><a href="growing.html">Growing</a></li>
    </ul>
  </nav>

  <main class="page page--library">
    <h1 class="page-title">How do I tell stories?</h1>
    <p class="page-subtitle">一座小型故事书架：关于我如何用文字观察和记录。</p>

    <section class="shelf shelf--bookshelf" id="writingShelf" aria-label="文章档案"></section>
  </main>

  <footer class="footer">
    <p><a href="index.html">&larr; Back to the tree</a></p>
  </footer>

  <script>
  var writings = [
    {
      title: '等你们回家，我们的“爸爸妈妈”',
      category: '官方融媒体中心',
      theme: '人物报道',
      intro: '疫情期间，一对夫妻同时奔赴抗疫前线，我选择跟随孩子的一天写等待与想念。',
      summary: '疫情期间，一对夫妻同时奔赴抗疫前线，我选择跟随孩子的一天写等待与想念。一天的等待、一次想念、一个家庭在特殊时期里的牵挂。',
      excerpt: '有时候，共情不是把人物写得更高大，而是让读者看见他们被谁等待。',
      link: 'https://mp.weixin.qq.com/s/vyO2djFZhI52K67BNjLCTQ'
    },
    {
      title: '这里藏着“琐碎”与爱',
      category: '校园公众号',
      theme: '城市观察',
      intro: '用更年轻、更具画面感的方式，讲述校园与城市之间那些细小但温暖的连接。',
      summary: '城市最动人的地方，常常不是地标，而是那些被我们反复路过的小事。',
      excerpt: '城市最动人的地方，常常不是地标，而是那些被我们反复路过的小事。',
      link: 'https://mp.weixin.qq.com/s/m2L7fVaiLomNAZzY8Ct0qg'
    },
    {
      title: '你眼中的五彩缤纷',
      category: '校园公众号',
      theme: '人物观察',
      intro: '以“眼里的色彩”为引子，记录不同学生眼里同一个校园的不同切面。',
      summary: '同一个地方，因为看见它的人不同，就会长出不同的光。',
      excerpt: '同一个地方，因为看见它的人不同，就会长出不同的光。',
      link: 'https://mp.weixin.qq.com/s/sRHTZ3gyw3L7J0GRqIVv6Q'
    },
    {
      title: '谁又动了我的能量',
      category: '校园公众号',
      theme: '公益推广',
      intro: '用一棵树的视角给所有种树的人写信，让公益参与被感知、被记住。',
      summary: '用一棵树的视角给所有种树的人写信，当一个人知道自己的行动正在改变什么，他就不只是参与者，也是故事的一部分。',
      excerpt: '当一个人知道自己的行动正在改变什么，他就不只是参与者，也是故事的一部分。',
      link: 'https://mp.weixin.qq.com/s/QfWLOlSQg6pTkD3F_oxh3g'
    },
    {
      title: '这个，这个，二两米饭',
      category: '个人公众号',
      theme: '个人写作',
      intro: '记录国庆期间寻访一家贵州餐馆的过程：那里藏着时令、童稚与节日记忆。',
      summary: '这是一篇关于味觉记忆的个人写作。食物不仅是食物，也是一条回到某段生活经验里的路。',
      excerpt: '有些味道不是为了填饱肚子，是为了确认自己还记得从哪里来。',
      link: 'https://mp.weixin.qq.com/s/iQPgnpwuTYUNePH58JWjdA'
    }
  ];

  writings.push({
    title: '即将更新，敬请期待',
    summary: '新的故事还在书架上整理中。',
    link: ''
  });

  var shelf = document.getElementById('writingShelf');

  shelf.innerHTML = [
    '<div class="bookshelf-stage">',
      '<img class="bookshelf-reference" src="bookshelf.png" alt="六本书并排放在书架上">',
      '<div class="shelf-overlays">',
        '<img class="shelf-book" src="shelf1.png" data-book="0" style="left:10.1%;top:4.4%;width:24%;height:90%;" alt="' + writings[0].title + '">',
        '<img class="shelf-book" src="shelf2.png" data-book="1" style="left:25%;top:5.5%;width:20%;height:88%;" alt="' + writings[1].title + '">',
        '<img class="shelf-book" src="shelf3.png" data-book="2" style="left:39%;top:10.8%;width:14%;height:82.5%;" alt="' + writings[2].title + '">',
        '<img class="shelf-book" src="shelf4.png" data-book="3" style="left:52.35%;top:7.5%;width:15%;height:86.8%;" alt="' + writings[3].title + '">',
        '<img class="shelf-book" src="shelf5.png" data-book="4" style="left:64.2%;top:0%;width:16%;height:94.5%;" alt="' + writings[4].title + '">',
      '</div>',
      '<div class="book-quote" id="bookQuote"></div>',
    '</div>',
    '<article class="writing-feature" id="writingFeature" aria-live="polite"></article>'
  ].join('');

  var feature = document.getElementById('writingFeature');
  var books = Array.prototype.slice.call(document.querySelectorAll('.shelf-book'));
  var bookQuoteEl = document.getElementById('bookQuote');
  var shelfStage = document.querySelector('.bookshelf-stage');

  // Book spine hover quotes
  var bookQuotes = [
    '疫情时期的小朋友。另一个视角下的抗疫生活。',
    '武汉，一座城市由无数普通人的生活组成。',
    '透明，也是一种颜色吗？',
    '蚂蚁森林：树会不会记得种下它的人？',
    '想念也会有味觉吗？'
  ];

  function renderFeature(index) {
    var item = writings[index];
    var imageHtml = '';
    if (index < 5) {
      imageHtml = '<img class="writing-feature-image" src="w' + (index + 1) + '.jpg" alt="' + item.title + '" loading="lazy">';
    }
    feature.innerHTML = [
      '<div class="writing-feature-text">',
        '<p class="writing-feature-kicker">Book ' + (index + 1) + '</p>',
        '<h2>' + item.title + '</h2>',
        '<p>' + item.summary + '</p>',
        item.link ? '<a class="archive-link" href="' + item.link + '" target="_blank" rel="noopener">阅读全文</a>' : '',
      '</div>',
      imageHtml
    ].join('');
  }

  books.forEach(function(book) {
    var index = Number(book.getAttribute('data-book'));
    book.addEventListener('mouseenter', function(e) {
      renderFeature(index);
      // Show book spine quote
      if (index < 5) {
        var stageRect = shelfStage.getBoundingClientRect();
        bookQuoteEl.textContent = bookQuotes[index];
        bookQuoteEl.style.left = (e.clientX - stageRect.left) + 'px';
        bookQuoteEl.style.top = (e.clientY - stageRect.top) + 'px';
        bookQuoteEl.classList.add('book-quote--visible');
      }
    });
    book.addEventListener('mousemove', function(e) {
      if (index < 5) {
        var stageRect = shelfStage.getBoundingClientRect();
        bookQuoteEl.style.left = (e.clientX - stageRect.left) + 'px';
        bookQuoteEl.style.top = (e.clientY - stageRect.top) + 'px';
      }
    });
    book.addEventListener('mouseleave', function() {
      bookQuoteEl.classList.remove('book-quote--visible');
    });
    book.addEventListener('click', function() { renderFeature(index); });
  });

  renderFeature(0);
  </script>

</body>
</html>
